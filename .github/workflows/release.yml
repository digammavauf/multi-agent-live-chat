name: Build plugin release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build installable ZIP
        run: |
          mkdir -p dist/multi-agent-live-chat
          cp multi-agent-live-chat.php readme.txt uninstall.php dist/multi-agent-live-chat/
          cp -R assets dist/multi-agent-live-chat/
          cd dist
          zip -qr ../multi-agent-live-chat.zip multi-agent-live-chat
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" multi-agent-live-chat.zip --title "$GITHUB_REF_NAME" --generate-notes
